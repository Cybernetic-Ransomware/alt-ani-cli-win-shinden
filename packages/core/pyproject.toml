[project]
name = "alt-ani-core"
version = "0.3.0"
requires-python = ">=3.14"
description = "Portable engine behind alt-ani-cli: Shinden integration, stream extraction, history"
license = { text = "EUPL-1.2" }
authors = [{ name = "Aleksander Marszałkiewicz" }]
dependencies = [
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
curl = ["curl-cffi>=0.15.0"]
selectolax = ["selectolax>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_ani_core"]
