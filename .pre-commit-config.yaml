default_install_hook_types:
  - pre-commit
  - post-merge

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        files: ^(apps|packages)/

      - id: ty-check
        name: ty type checker
        entry: uv run ty check apps packages/core/src
        language: system
        types: [python]
        files: ^(apps|packages)/
        pass_filenames: false

      - id: import-contracts
        name: import-linter contracts
        entry: uv run lint-imports
        language: system
        types: [python]
        files: ^(apps|packages)/
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: uv run python -m codespell_lib
        language: system
        types_or: [python, markdown, yaml, rst]

      - id: bandit
        name: bandit security check
        entry: uv run bandit -c pyproject.toml -r
        language: system
        types: [python]
        files: ^(apps|packages)/
