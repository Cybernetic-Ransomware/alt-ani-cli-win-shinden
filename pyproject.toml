[project]
name = "alt-ani-workspace"
version = "0.3.0"
requires-python = ">=3.14"
description = "Development workspace: the alt-ani-core engine, the alt-ani-cli-win CLI and the Android bridge"
dependencies = [
    "alt-ani-cli-win",
    "alt-ani-core[curl,selectolax]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/cli"]

[tool.uv.sources]
alt-ani-core = { workspace = true }
alt-ani-cli-win = { workspace = true }

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "commitizen>=4.13.9",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "ty>=0.0.32",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the bridge is not a distribution: Chaquopy loads it from the Android app's Python source directory
pythonpath = ["apps/android/app/src/main/python"]
addopts = "--cov=alt_ani_cli --cov=alt_ani_core --cov-report=html:tests/result/html --cov-report=term-missing -q -m 'not integration' --junitxml=tests/result/pytest_result.xml"
markers = [
    "unit: tests with no external dependencies",
    "integration: tests requiring network access",
    "loopback: tests talking only to a local server they start themselves",
]

[tool.coverage.run]
data_file = "tests/result/.coverage"

[tool.ruff]
line-length = 128

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 128

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

# Explicit, because auto-detection depends on which package directories exist locally and made CI sort differently.
[tool.ruff.lint.isort]
known-first-party = ["alt_ani_core", "alt_ani_cli", "alt_ani_bridge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "E501"]
"test_*.py" = ["F401", "F841"]

[tool.ty.src]
exclude = ["tests/*", "tools/*"]

[tool.ty.environment]
extra-paths = ["apps/cli/src", "packages/core/src", "apps/android/app/src/main/python"]

[tool.codespell]
skip = "./.git,./.github,./tests/*,./temp/*,./tools/*,*apps/android/build,*apps/android/app/build,*apps/android/.gradle"
builtin = "clear"
quiet-level = 3
ignore-words-list = "daty,serie,autor"

[tool.bandit]
skips = ["B404", "B603"]
exclude_dirs = ["tests", "tools", ".venv", "*apps/android/build/*", "*apps/android/app/build/*", "*apps/android/.gradle/*"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "apps/cli/pyproject.toml:version",
    "apps/cli/src/alt_ani_cli/__init__.py:__version__",
    "packages/core/pyproject.toml:version",
    "packages/core/src/alt_ani_core/__init__.py:__version__",
]
change_type_order = ["feat", "fix", "hotfix", "chore", "docs", "refactor", "test"]
schema_pattern = "(build|chore|ci|docs|feature|feat|fix|hotfix|perf|refactor|style|test|config)(\\(.+\\))?!?: .+"

[tool.commitizen.schema_mapping]
feature = "feat"
hotfix = "fix"
config = "chore"

[[tool.commitizen.customize.questions]]
type = "list"
name = "type"
message = "Commit type?"
choices = [
    { value = "feat", name = "feature" },
    { value = "fix", name = "hotfix" },
    { value = "chore", name = "config" },
    { value = "refactor", name = "refactor" },
    { value = "docs", name = "docs" },
    { value = "test", name = "tests" },
    { value = "chore", name = "chore/other" },
]

[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
hotfix = "Hotfixes"
chore = "Chores"
docs = "Documentation"
refactor = "Refactors"
test = "Tests"

[tool.importlinter]
# alt_ani_bridge is not installed (Chaquopy loads it from source); tests/architecture covers it
root_packages = ["alt_ani_core", "alt_ani_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Engine layers point downwards only"
type = "layers"
layers = [
    "alt_ani_cli",
    "alt_ani_core.services",
    "alt_ani_core.shinden : alt_ani_core.extract : alt_ani_core.download : alt_ani_core.transfer : alt_ani_core.history : alt_ani_core.storage",
    "alt_ani_core.rules",
    "alt_ani_core.transport : alt_ani_core.dom : alt_ani_core.diagnostics",
    "alt_ani_core.models : alt_ani_core.state : alt_ani_core.errors : alt_ani_core.events : alt_ani_core.cancel : alt_ani_core.config : alt_ani_core.redaction : alt_ani_core.messages",
]
ignore_imports = [
    # test doubles implement every contract in one module
    "alt_ani_core.testing -> **",
]

[[tool.importlinter.contracts]]
name = "The engine is free of terminal and desktop modules"
type = "forbidden"
source_modules = ["alt_ani_core"]
allow_indirect_imports = true
forbidden_modules = ["alt_ani_cli", "rich", "InquirerPy", "prompt_toolkit", "argparse", "platformdirs", "colorama", "yaml", "subprocess"]

[[tool.importlinter.contracts]]
name = "Applications reach hosts only through the engine"
type = "forbidden"
source_modules = ["alt_ani_cli"]
allow_indirect_imports = true
forbidden_modules = ["curl_cffi", "selectolax", "yt_dlp"]
