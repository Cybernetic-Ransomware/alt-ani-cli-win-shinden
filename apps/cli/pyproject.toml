[project]
name = "alt-ani-cli-win"
version = "0.3.0"
requires-python = ">=3.14"
description = "CLI for watching and downloading anime from shinden.pl on Windows"
license = { text = "EUPL-1.2" }
authors = [{ name = "Aleksander Marszałkiewicz" }]
dependencies = [
    "alt-ani-core[curl,selectolax]",
    "inquirerpy>=0.3",
    "platformdirs>=4.0",
    "rich>=13.0",
    "colorama>=0.4",
    "brotli>=1.2.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/Cybernetic-Ransomware/alt-ani-cli-win-shinden"

[project.scripts]
alt-ani-cli = "alt_ani_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_ani_cli"]

[tool.uv.sources]
alt-ani-core = { workspace = true }
